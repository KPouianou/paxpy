[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paxpy"
version = "0.4.0"
description = "Detect semantic merge conflicts in Python via program dependence graph analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Konstantinos Pouianou"},
]
keywords = ["semantic-merge-conflict", "program-analysis", "sdg", "python-ast", "merge", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "gitpython>=3.1.40",
]

[project.urls]
Homepage = "https://github.com/KPouianou/paxpy"
Issues = "https://github.com/KPouianou/paxpy/issues"

[project.scripts]
paxpy = "paxpy.__main__:main"

[project.optional-dependencies]
dev   = ["pytest>=8.0", "ruff>=0.6"]
bench = ["rich>=13.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/paxpy"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/integration"]
markers = [
    "integration: end-to-end pipeline tests using synthetic git repos",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
