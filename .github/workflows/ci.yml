name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required if paxpy is ever run against this repo itself.
          # Also needed for any test that calls git diff with the three-dot syntax.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest --tb=short -q
        env:
          # Ensure git commits in synthetic test repos always have a valid identity,
          # regardless of whether the runner has a global git config.
          GIT_AUTHOR_NAME: "CI Runner"
          GIT_AUTHOR_EMAIL: "ci@example.com"
          GIT_COMMITTER_NAME: "CI Runner"
          GIT_COMMITTER_EMAIL: "ci@example.com"
